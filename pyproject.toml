[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.14"
packages = ["custom_components.meteofrance_montagne"]
explicit_package_bases = true
strict = true
warn_unreachable = true
local_partial_types = true
enable_error_code = [
    "ignore-without-code",
    "redundant-self",
    "truthy-iterable",
]

[[tool.mypy.overrides]]
# Home Assistant re-exports its public names without marking them
module = "homeassistant.*"
implicit_reexport = true
